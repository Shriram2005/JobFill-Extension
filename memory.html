<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobFill — Learned Answers</title>
  <link rel="stylesheet" href="memory.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="page-title">Learned Answers</h1>
        <span class="count-pill" id="totalBadge">0 answers</span>
      </div>
      <div class="header-actions">
        <button id="addEntryBtn" class="btn-solid">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New answer</span>
        </button>
        <button id="testMatcherBtn" class="btn-subtle">Test match</button>
        <button id="exportBtn" class="btn-subtle">Export</button>
        <button id="importBtn" class="btn-subtle">Import</button>
        <input type="file" id="importFileInput" accept=".json" class="hidden" />
        <button id="clearAllBtn" class="btn-subtle text-danger">Clear all</button>
        <button id="backBtn" class="btn-subtle">← Settings</button>
      </div>
    </header>

    <!-- Test Matcher Collapsible Section -->
    <section class="test-drawer hidden" id="testMatcherDrawer">
      <div class="drawer-header">
        <h3>Test match against memory</h3>
        <button id="closeMatcherBtn" class="btn-close">×</button>
      </div>
      <p class="drawer-desc">Paste an application prompt to see which saved answer JobFill prioritizes:</p>
      <div class="test-input-row">
        <input type="text" id="testQuestionInput" placeholder="e.g. Do you have experience with Kotlin?" autocomplete="off" />
        <button id="runMatchTestBtn" class="btn-solid">Match</button>
      </div>
      <div id="testMatchResult" class="test-result hidden"></div>
    </section>

    <!-- Add Entry Collapsible Section -->
    <section class="add-drawer hidden" id="addDrawer">
      <div class="drawer-header">
        <h3 id="drawerTitle">Add new answer</h3>
        <button id="closeDrawerBtn" class="btn-close">×</button>
      </div>
      <div class="field">
        <label for="newQuestion">Question / Label</label>
        <input type="text" id="newQuestion" placeholder="e.g. Why are you interested in this position?" autocomplete="off" />
      </div>
      <div class="field" style="margin-top: 12px;">
        <label for="newAnswer">Answer</label>
        <textarea id="newAnswer" rows="3" placeholder="Enter your preferred answer to save..."></textarea>
      </div>
      <div class="drawer-actions">
        <button id="saveDrawerBtn" class="btn-solid">Save answer</button>
        <button id="cancelDrawerBtn" class="btn-subtle">Cancel</button>
        <span id="drawerStatus" class="inline-status"></span>
      </div>
    </section>

    <!-- Filter and Search Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Filter answers..." autocomplete="off" />
        <button id="clearSearchBtn" class="clear-btn hidden" title="Clear">×</button>
      </div>

      <div class="toolbar-controls">
        <div class="sort-group">
          <label for="sortSelect">Sort:</label>
          <select id="sortSelect">
            <option value="recent">Recently used</option>
            <option value="frequent">Most used</option>
            <option value="alpha">Alphabetical</option>
            <option value="oldest">Oldest first</option>
          </select>
        </div>
        <span id="filterSummary" class="meta-label">0 items</span>
      </div>
    </div>

    <!-- Answers List -->
    <div id="memoryList" class="answer-list"></div>

    <!-- Empty State -->
    <div class="empty-box hidden" id="emptyState">
      <h3>No answers saved yet</h3>
      <p>JobFill automatically saves answers when you click "Save answers" on a form, or you can add them manually.</p>
      <button id="emptyAddBtn" class="btn-solid" style="margin-top: 14px;">+ Add an answer</button>
    </div>

    <!-- Modal Dialog -->
    <div class="modal-overlay hidden" id="confirmModal">
      <div class="modal-box">
        <h3 id="modalTitle">Confirm</h3>
        <p id="modalMessage" class="modal-msg"></p>
        <div class="modal-actions">
          <button id="modalConfirmBtn" class="btn-solid btn-danger-solid">Delete</button>
          <button id="modalCancelBtn" class="btn-subtle">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="constants.js"></script>
  <script src="memory.js"></script>
</body>
</html>
