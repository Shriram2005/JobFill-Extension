<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobFill — AI Application Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">JobFill</span>
          <span class="brand-badge">PRO</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="memoryBtn" class="icon-action-btn" title="Learning Memory" aria-label="Learning Memory">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04z"></path>
            <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04z"></path>
          </svg>
          <span id="memoryCountBadge" class="count-badge hidden">0</span>
        </button>
        <button id="optionsBtn" class="icon-action-btn" title="Open Settings" aria-label="Open Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Target Tab Banner -->
      <div id="tabBanner" class="tab-banner">
        <div class="tab-indicator-dot"></div>
        <div class="tab-info">
          <span id="tabDomain" class="tab-domain">Detecting page...</span>
          <span id="tabType" class="tab-type">Active Tab</span>
        </div>
      </div>

      <!-- Readiness Matrix -->
      <section class="readiness-card">
        <div class="readiness-header">
          <span class="readiness-title">System Status</span>
          <span id="overallStatusBadge" class="status-pill status-ready">Checking...</span>
        </div>
        <div class="matrix-grid">
          <div id="keyCheck" class="matrix-item" title="Click to configure Gemini API Key">
            <span class="matrix-dot"></span>
            <span class="matrix-label">API Key</span>
            <span class="matrix-val" id="keyVal">Checking</span>
          </div>
          <div id="profileCheck" class="matrix-item" title="Click to view Profile data">
            <span class="matrix-dot"></span>
            <span class="matrix-label">Profile</span>
            <span class="matrix-val" id="profileVal">Checking</span>
          </div>
          <div id="resumeCheck" class="matrix-item" title="Click to view Resumes">
            <span class="matrix-dot"></span>
            <span class="matrix-label">Resumes</span>
            <span class="matrix-val" id="resumeVal">Checking</span>
          </div>
        </div>
      </section>

      <!-- Primary Action Area -->
      <section class="action-card">
        <button id="fillBtn" class="primary-btn">
          <span class="btn-glow"></span>
          <span class="btn-content">
            <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span id="fillBtnText">Fill This Application</span>
          </span>
          <span class="shortcut-pill" title="Keyboard Shortcut">Alt+Shift+F</span>
        </button>

        <p class="action-subtext">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -1px; margin-right: 3px;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Assisted filling • Never submits automatically
        </p>

        <!-- Live Status Row -->
        <div id="statusRow" class="status-box hidden">
          <div class="status-spinner" id="statusSpinner"></div>
          <span id="statusText" class="status-text">Processing form fields...</span>
        </div>
      </section>

      <!-- Recent Activity Log Section -->
      <section class="activity-section">
        <div class="section-head">
          <div class="section-title-wrap">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <h2>Recent Activity</h2>
          </div>
          <div class="section-actions">
            <button id="exportBtn" class="subtle-link-btn" title="Export activity log to JSON">Export</button>
            <span class="dot-separator">•</span>
            <button id="clearLogBtn" class="subtle-link-btn" title="Clear activity history">Clear</button>
          </div>
        </div>

        <ul id="logList" class="log-list">
          <li class="empty-log">
            <div class="empty-icon">📝</div>
            <span>No applications filled yet</span>
          </li>
        </ul>
      </section>
    </main>

    <!-- Footer Guarantee -->
    <footer class="app-footer">
      <div class="security-guarantee">
        <span class="shield-icon">🛡️</span>
        <span>Runs locally on your browser. Zero tracking.</span>
      </div>
    </footer>
  </div>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
