<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobFill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-root">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-name">JobFill</span>
        <span class="status-indicator" id="headerStatusDot" title="Ready"></span>
      </div>

      <div class="header-nav">
        <button id="memoryBtn" class="nav-btn" title="Saved answers" aria-label="Saved answers">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span id="memoryCountBadge" class="badge-count hidden">0</span>
        </button>
        <button id="optionsBtn" class="nav-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Target Site Bar -->
      <div id="tabBanner" class="site-bar">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" class="site-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span id="tabDomain" class="site-domain">Checking tab...</span>
        <span id="tabType" class="site-tag">Application form</span>
      </div>

      <!-- System Readiness Checklist -->
      <div class="readiness-row">
        <button id="keyCheck" class="readiness-tag" title="API Key settings">
          <span class="tag-bullet bullet-ok" id="keyBullet"></span>
          <span class="tag-label">API Key</span>
          <span class="tag-state" id="keyVal">Ready</span>
        </button>
        <button id="profileCheck" class="readiness-tag" title="Profile settings">
          <span class="tag-bullet bullet-ok" id="profileBullet"></span>
          <span class="tag-label">Profile</span>
          <span class="tag-state" id="profileVal">Loaded</span>
        </button>
        <button id="resumeCheck" class="readiness-tag" title="Resume settings">
          <span class="tag-bullet bullet-ok" id="resumeBullet"></span>
          <span class="tag-label">Resumes</span>
          <span class="tag-state" id="resumeVal">1 active</span>
        </button>
      </div>

      <!-- Action Button -->
      <div class="action-block">
        <button id="fillBtn" class="btn-fill">
          <span class="btn-text" id="fillBtnText">Fill application</span>
          <kbd class="shortcut-key">Alt+Shift+F</kbd>
        </button>

        <div id="statusRow" class="status-inline hidden">
          <span class="spinner" id="statusSpinner"></span>
          <span id="statusText" class="status-label">Working on form...</span>
        </div>
      </div>

      <!-- Recent History -->
      <section class="history-block">
        <div class="history-header">
          <span class="history-title">Recent applications</span>
          <div class="history-actions">
            <button id="exportBtn" class="text-link">Export</button>
            <span class="sep">·</span>
            <button id="clearLogBtn" class="text-link">Clear</button>
          </div>
        </div>

        <ul id="logList" class="log-list">
          <li class="log-empty">No applications filled yet</li>
        </ul>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Fills assisted fields · Never submits automatically</span>
    </footer>
  </div>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
